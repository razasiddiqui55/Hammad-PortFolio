name: hammad_portfolio
description: "Professional Flutter Developer Portfolio"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.18.0 <3.0.0"  # lowered to match Flutter 3.3.10 / Dart 2.18.6

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  animated_text_kit: ^4.3.0
  font_awesome_flutter: 10.9.0  # pinned to compatible version
  url_launcher: ^6.3.2
  google_fonts: ^6.3.2
  flutter_svg: ^2.2.2
  flutter_email_sender: ^8.0.0
  http: ^1.6.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/svg/