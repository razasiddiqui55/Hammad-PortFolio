<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Hammad Siddiqui - Flutter Developer Portfolio. Crafting beautiful cross-platform mobile experiences.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hammad Siddiqui">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hammad Siddiqui - Flutter Developer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      overflow: hidden;
    }

    /* Loading Screen */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out, transform 0.3s ease-out;
    }

    #loading.fade-out {
      opacity: 0;
      transform: scale(1.05);
      pointer-events: none;
    }

    /* Animated Background Orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.6;
      animation: float 20s ease-in-out infinite;
    }

    .orb-1 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.4), transparent);
      top: -100px;
      right: -100px;
      animation-delay: 0s;
    }

    .orb-2 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(147, 51, 234, 0.3), transparent);
      bottom: -150px;
      left: -150px;
      animation-delay: 5s;
    }

    .orb-3 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.3), transparent);
      top: 30%;
      left: 50%;
      animation-delay: 10s;
    }

    @keyframes float {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }
      25% {
        transform: translate(30px, -30px) scale(1.1);
      }
      50% {
        transform: translate(-20px, 20px) scale(0.9);
      }
      75% {
        transform: translate(20px, 30px) scale(1.05);
      }
    }

    /* Logo Container */
    .logo-container {
      position: relative;
      z-index: 10;
      margin-bottom: 40px;
    }

    /* Animated Logo */
    .logo {
      font-size: 80px;
      font-weight: 900;
      background: linear-gradient(135deg, #2563EB, #9333EA, #EC4899);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -3px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        filter: brightness(1);
      }
      50% {
        transform: scale(1.05);
        filter: brightness(1.2);
      }
    }

    /* Tagline */
    .tagline {
      color: rgba(255, 255, 255, 0.8);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 50px;
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Loading Bar Container */
    .loading-bar-container {
      width: 300px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(37, 99, 235, 0.2);
    }

    /* Animated Loading Bar */
    .loading-bar {
      height: 100%;
      background: linear-gradient(90deg, #2563EB, #9333EA, #EC4899, #2563EB);
      background-size: 200% 100%;
      border-radius: 10px;
      animation: loading 2s ease-in-out infinite, shimmer 1.5s linear infinite;
      box-shadow: 0 0 20px rgba(37, 99, 235, 0.5);
    }

    @keyframes loading {
      0% {
        width: 0%;
      }
      50% {
        width: 70%;
      }
      100% {
        width: 100%;
      }
    }

    @keyframes shimmer {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }

    /* Loading Text */
    .loading-text {
      margin-top: 20px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% {
        opacity: 0.6;
      }
      50% {
        opacity: 1;
      }
    }

    /* Particles */
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      animation: particle-float 3s ease-in-out infinite;
    }

    @keyframes particle-float {
      0%, 100% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100px) translateX(50px);
        opacity: 0;
      }
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .logo {
        font-size: 60px;
      }

      .tagline {
        font-size: 14px;
      }

      .loading-bar-container {
        width: 250px;
      }

      .orb-1, .orb-2, .orb-3 {
        width: 300px;
        height: 300px;
      }
    }
  </style>

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter_bootstrap.js" async></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script type="text/javascript">
  (function(){
    emailjs.init("2HwgE63tsGB6HrHC9");  // ← replace with your real Public Key from EmailJS dashboard
  })();
</script>
</head>
<body>
<!-- Loading Screen -->
<div id="loading">
  <!-- Animated Background Orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Particles -->
  <div class="particle" style="left: 20%; animation-delay: 0s;"></div>
  <div class="particle" style="left: 40%; animation-delay: 0.5s;"></div>
  <div class="particle" style="left: 60%; animation-delay: 1s;"></div>
  <div class="particle" style="left: 80%; animation-delay: 1.5s;"></div>

  <!-- Logo -->
  <div class="logo-container">
    <div class="logo">HS</div>
  </div>

  <!-- Tagline -->
  <div class="tagline">Flutter Developer</div>

  <!-- Loading Bar -->
  <div class="loading-bar-container">
    <div class="loading-bar"></div>
  </div>

  <!-- Loading Text -->
  <div class="loading-text">Loading Portfolio...</div>
</div>

<script>
    // Wait for Flutter to be ready
    window.addEventListener('flutter-first-frame', function () {
      const loadingElement = document.getElementById('loading');
      if (loadingElement) {
        loadingElement.classList.add('fade-out');
        // Remove element after fade animation
        setTimeout(function() {
          loadingElement.remove();
        }, 500);
      }
    });
  </script>
</body>
</html>
