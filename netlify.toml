[build]
publish = "build/web"
command = """
    if [ ! -d "flutter" ]; then
      git clone https://github.com/flutter/flutter.git -b 3.24.5 --depth 1
    fi

    export PATH="$PATH:`pwd`/flutter/bin"

    flutter config --no-analytics
    flutter pub get
    flutter build web --release
"""

[[redirects]]
from = "/*"
to = "/index.html"
status = 200